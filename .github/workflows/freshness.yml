name: freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 3"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Check source freshness
        id: freshness
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_freshness.py --review 2>&1 | tee freshness.txt

      - name: Check source reachability
        id: reachability
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_sources.py --report reachability.json 2>&1 | tee reachability.txt

      - name: Create or update maintenance issue
        if: steps.freshness.outcome == 'failure' || steps.reachability.outcome == 'failure'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const maintain = require('./.github/scripts/maintenance-issue.cjs');
            const result = await maintain({ github, context });
            core.info(JSON.stringify(result));

      - name: Fail workflow when review is required
        if: steps.freshness.outcome == 'failure' || steps.reachability.outcome == 'failure'
        run: exit 1
